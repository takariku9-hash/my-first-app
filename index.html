<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>かいごの相談チャット｜施設さがしをやさしくサポート</title>
<style>
  :root{
    --bg:#f3f7f4;
    --card:#ffffff;
    --primary:#3f8f6e;      /* やわらかいグリーン */
    --primary-dark:#2f7058;
    --primary-soft:#e7f3ed;
    --accent:#e8915b;       /* あたたかいオレンジ（相談員アクセント） */
    --text:#2f3a36;
    --text-sub:#69756f;
    --line:#e2ebe6;
    --bubble-bot:#ffffff;
    --bubble-user:#dff0e7;
    --shadow:0 2px 10px rgba(47,112,88,.10);
    --warn:#c2683f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    position:relative;
  }

  /* ヘッダー */
  .header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;
    padding:14px 18px;
    display:flex;align-items:center;gap:12px;
    box-shadow:0 2px 12px rgba(47,112,88,.25);
  }
  .header .avatar{
    width:42px;height:42px;border-radius:50%;
    background:#fff;color:var(--primary);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.12);
  }
  .header .title{font-size:16px;font-weight:700;letter-spacing:.02em;}
  .header .sub{font-size:11.5px;opacity:.92;font-weight:400;margin-top:1px;}
  .header .status{margin-left:auto;font-size:11px;display:flex;align-items:center;gap:5px;opacity:.95;}
  .header .dot{width:8px;height:8px;border-radius:50%;background:#9ff0c4;box-shadow:0 0 0 3px rgba(159,240,196,.3);}

  /* 進捗バー */
  .progress-wrap{padding:10px 18px 4px;background:var(--bg);position:sticky;top:70px;z-index:15;}
  .progress-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),#5fb389);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}
  .progress-label{font-size:11px;color:var(--text-sub);margin-top:5px;text-align:right;}

  /* チャット領域 */
  .chat{
    flex:1;
    padding:14px 14px 24px;
    overflow-y:auto;
    display:flex;flex-direction:column;gap:14px;
  }

  .row{display:flex;gap:9px;align-items:flex-end;animation:fadeUp .4s ease both;}
  .row.bot{justify-content:flex-start;}
  .row.user{justify-content:flex-end;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .mini-avatar{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;
    box-shadow:var(--shadow);
  }
  .bubble{
    max-width:78%;
    padding:11px 15px;
    border-radius:18px;
    font-size:14.5px;
    box-shadow:var(--shadow);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .bot .bubble{
    background:var(--bubble-bot);
    border-top-left-radius:5px;
    color:var(--text);
  }
  .user .bubble{
    background:var(--bubble-user);
    border-top-right-radius:5px;
    color:var(--primary-dark);
    font-weight:600;
  }

  /* タイピングインジケータ */
  .typing{display:flex;gap:4px;padding:14px 16px;}
  .typing span{width:8px;height:8px;border-radius:50%;background:#bcd3c8;animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}

  /* 選択肢ボタン群 */
  .options{
    display:flex;flex-direction:column;gap:9px;
    padding:2px 4px 2px 43px;
    animation:fadeUp .4s ease both;
  }
  .opt-btn{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    font-size:15px;font-weight:600;
    color:var(--text);
    text-align:left;
    cursor:pointer;
    transition:.18s;
    box-shadow:0 1px 3px rgba(47,112,88,.06);
    display:flex;align-items:center;gap:10px;
    line-height:1.4;
  }
  .opt-btn .ic{font-size:20px;flex-shrink:0;}
  .opt-btn .sub{font-size:12px;font-weight:400;color:var(--text-sub);display:block;margin-top:2px;}
  .opt-btn:active{transform:scale(.98);}
  .opt-btn:hover{border-color:var(--primary);background:var(--primary-soft);}

  /* 自由記述 */
  .free-input{
    padding:6px 4px 2px 43px;animation:fadeUp .4s ease both;
  }
  .free-input textarea{
    width:100%;border:1.5px solid var(--line);border-radius:14px;
    padding:13px 15px;font-size:15px;font-family:inherit;
    resize:none;min-height:96px;color:var(--text);background:var(--card);
    box-shadow:0 1px 3px rgba(47,112,88,.06);
  }
  .free-input textarea:focus{outline:none;border-color:var(--primary);background:#fbfdfc;}
  .free-input .hint{font-size:11.5px;color:var(--text-sub);margin:6px 2px;}
  .send-row{display:flex;gap:8px;margin-top:8px;}
  .send-btn{
    flex:1;background:var(--primary);color:#fff;border:none;border-radius:14px;
    padding:13px;font-size:15px;font-weight:700;cursor:pointer;transition:.18s;
    box-shadow:var(--shadow);
  }
  .send-btn:active{transform:scale(.98);}
  .send-btn:disabled{opacity:.5;}
  .skip-btn{
    background:transparent;color:var(--text-sub);border:1.5px solid var(--line);
    border-radius:14px;padding:13px 18px;font-size:13.5px;cursor:pointer;
  }

  /* 種別提案カード */
  .type-cards{display:flex;flex-direction:column;gap:12px;padding:2px 2px 2px 43px;animation:fadeUp .4s ease both;}
  .type-card{
    background:var(--card);border-radius:16px;overflow:hidden;
    box-shadow:var(--shadow);border:1.5px solid var(--line);
  }
  .type-card .tc-head{
    padding:13px 15px 11px;display:flex;align-items:flex-start;gap:10px;
    background:linear-gradient(135deg,var(--primary-soft),#f3faf6);
    border-bottom:1px solid var(--line);
  }
  .rank-badge{
    flex-shrink:0;width:30px;height:30px;border-radius:9px;
    background:var(--primary);color:#fff;font-weight:800;font-size:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .rank-badge.r1{background:linear-gradient(135deg,#e8a93b,#d8902a);}
  .rank-badge.r2{background:linear-gradient(135deg,#9aa7ad,#7d8a90);}
  .rank-badge.r3{background:linear-gradient(135deg,#c79a6b,#b07f4f);}
  .tc-head .tc-name{font-size:16px;font-weight:800;color:var(--primary-dark);}
  .tc-head .tc-tag{font-size:11.5px;color:var(--text-sub);margin-top:1px;}
  .tc-body{padding:13px 15px;}
  .tc-section{margin-bottom:10px;}
  .tc-section:last-child{margin-bottom:0;}
  .tc-section .lbl{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;margin-bottom:3px;}
  .lbl.reason{color:var(--primary-dark);}
  .lbl.merit{color:#2f8f5b;}
  .lbl.demerit{color:var(--warn);}
  .tc-section p{margin:0;font-size:13.5px;color:var(--text);}
  .tc-select{
    width:100%;border:none;border-top:1px solid var(--line);
    background:#fff;color:var(--primary);font-weight:800;font-size:14.5px;
    padding:13px;cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .tc-select:hover{background:var(--primary-soft);}
  .tc-select:active{background:var(--primary);color:#fff;}

  /* 施設カード */
  .facility-cards{display:flex;flex-direction:column;gap:11px;padding:2px 2px 2px 43px;animation:fadeUp .4s ease both;}
  .fac-card{
    background:var(--card);border-radius:15px;padding:13px 15px;
    box-shadow:var(--shadow);border:1.5px solid var(--line);
    position:relative;
  }
  .fac-rank{
    position:absolute;top:-7px;left:-7px;width:26px;height:26px;border-radius:50%;
    background:var(--primary);color:#fff;font-weight:800;font-size:12px;
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
  }
  .fac-name{font-size:15.5px;font-weight:800;color:var(--text);margin-bottom:6px;line-height:1.35;}
  .fac-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px;}
  .chip{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--primary-soft);color:var(--primary-dark);font-weight:600;}
  .chip.price{background:#fdf0e6;color:var(--accent);}
  .chip.room{background:#eaf4fb;color:#3b7fb0;}
  .chip.room.few{background:#fdeaea;color:#c2683f;}
  .fac-reason{font-size:13px;color:var(--text-sub);display:flex;gap:6px;align-items:flex-start;}
  .fac-reason .q{color:var(--primary);font-weight:800;flex-shrink:0;}

  /* CTA 相談員 */
  .cta-box{
    margin:4px 2px 2px 43px;
    background:linear-gradient(135deg,#fff6ef,#fdeee3);
    border:1.5px solid #f3d9c4;border-radius:16px;padding:16px;
    text-align:center;animation:fadeUp .4s ease both;box-shadow:var(--shadow);
  }
  .cta-box .cta-icon{font-size:30px;}
  .cta-box .cta-title{font-size:15px;font-weight:800;color:var(--accent);margin:4px 0 3px;}
  .cta-box .cta-desc{font-size:12.5px;color:var(--text-sub);margin-bottom:13px;}
  .cta-btn{
    width:100%;background:linear-gradient(135deg,var(--accent),#dd7e44);color:#fff;border:none;
    border-radius:14px;padding:15px;font-size:15.5px;font-weight:800;cursor:pointer;
    box-shadow:0 3px 10px rgba(232,145,91,.35);transition:.18s;
  }
  .cta-btn:active{transform:scale(.98);}
  .cta-note{font-size:11px;color:var(--text-sub);margin-top:9px;}

  /* リスタート */
  .restart{
    text-align:center;padding:8px 0 18px;
  }
  .restart button{
    background:transparent;border:1.5px solid var(--line);color:var(--text-sub);
    border-radius:99px;padding:9px 20px;font-size:12.5px;cursor:pointer;
  }

  /* モーダル（ダミー相談） */
  .modal-bg{
    position:fixed;inset:0;background:rgba(47,58,54,.5);z-index:50;
    display:none;align-items:flex-end;justify-content:center;
  }
  .modal-bg.show{display:flex;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;
    padding:26px 22px calc(26px + env(safe-area-inset-bottom));
    text-align:center;animation:slideUp .3s cubic-bezier(.4,0,.2,1);
  }
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .modal .m-icon{font-size:40px;}
  .modal h3{margin:8px 0 6px;font-size:18px;color:var(--primary-dark);}
  .modal p{font-size:13.5px;color:var(--text-sub);margin:0 0 18px;}
  .modal .m-close{
    width:100%;background:var(--primary);color:#fff;border:none;border-radius:14px;
    padding:14px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .modal .m-demo{font-size:11px;color:#b0bbb5;margin-top:12px;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="avatar">🌿</div>
    <div>
      <div class="title">かいごの相談チャット</div>
      <div class="sub">あんしん施設さがしサポート</div>
    </div>
    <div class="status"><span class="dot"></span>相談員AI 対応中</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">はじめます</div>
  </div>

  <div class="chat" id="chat"></div>
</div>

<!-- ダミーモーダル -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="m-icon">💬</div>
    <h3>相談員におつなぎします</h3>
    <p>ご入力ありがとうございます。専門の相談員より、ご希望に合わせて施設のご案内・見学のお手伝いをいたします。お電話またはメールでご連絡いたします。</p>
    <button class="m-close" onclick="closeModal()">わかりました</button>
    <div class="m-demo">※ これはプロトタイプのデモ画面です</div>
  </div>
</div>

const chat = document.getElementById('chat');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

/* ============================================================
   ユーティリティ：吹き出し・選択肢の描画
   ============================================================ */
function scrollDown(){ requestAnimationFrame(()=>{ chat.scrollTop = chat.scrollHeight; }); }

function updateProgress(n,label){
  const pct = Math.min(100, Math.round(n/TOTAL_STEPS*100));
  progressFill.style.width = pct + "%";
  progressLabel.textContent = label || ("ステップ " + n + " / " + TOTAL_STEPS);
}

function botBubble(text){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = `<div class="mini-avatar">🌿</div><div class="bubble">${text}</div>`;
  chat.appendChild(row); scrollDown();
  return row;
}
function userBubble(text){
  const row = document.createElement('div');
  row.className = 'row user';
  row.innerHTML = `<div class="bubble">${text}</div>`;
  chat.appendChild(row); scrollDown();
}

// タイピング演出 → コールバック
function botTyping(delay, cb){
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = `<div class="mini-avatar">🌿</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
  chat.appendChild(row); scrollDown();
  setTimeout(()=>{ row.remove(); cb(); }, delay);
}

// 複数の吹き出しを順に出す
function botSequence(messages, done){
  let i = 0;
  function next(){
    if(i >= messages.length){ if(done) done(); return; }
    botTyping(messages[i].d || 700, ()=>{ botBubble(messages[i].t); i++; next(); });
  }
  next();
}

// 選択肢ボタン群を描画。選ぶと回答を吹き出し化してコールバック
function showOptions(options, onPick){
  const wrap = document.createElement('div');
  wrap.className = 'options';
  options.forEach(o=>{
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.innerHTML = `<span class="ic">${o.ic||""}</span><span>${o.label}${o.sub?`<span class="sub">${o.sub}</span>`:""}</span>`;
    b.onclick = ()=>{
      wrap.remove();
      userBubble(o.value);
      onPick(o);
    };
    wrap.appendChild(b);
  });
  chat.appendChild(wrap); scrollDown();
}

/* ============================================================
   ステップ6：種別判定ロジック → トップ3提案
   ============================================================ */
function rankTypes(){
  // 各種別にスコアを付与
  const score = {groupHome:0,tokuyo:0,kaigotsuki:0,jutaku:0,sakou:0,roken:0,carehouse:0};

  // --- 要介護度 ---
  switch(state.care){
    case "自立":
      score.sakou+=4; score.carehouse+=4; score.jutaku+=3; break;
    case "要支援1〜2":
      score.sakou+=4; score.carehouse+=3; score.jutaku+=3; score.groupHome+=1; break;
    case "要介護1〜2":
      score.jutaku+=3; score.kaigotsuki+=3; score.groupHome+=2; score.sakou+=2; score.roken+=1; break;
    case "要介護3〜5":
      score.tokuyo+=5; score.kaigotsuki+=4; score.roken+=2; score.groupHome+=1; break;
    case "未判定":
      score.jutaku+=2; score.sakou+=2; score.kaigotsuki+=2; score.roken+=1; break;
  }

  // --- 認知症（あり=軽度/中度以上ではグループホームを強く加点） ---
  if(state.dementia === "認知症（中度以上）"){
    score.groupHome+=6; score.kaigotsuki+=2; score.tokuyo+=1;
    // 自立寄りでも認知症中度以上なら見守りの薄い形は減点
    score.sakou-=2; score.carehouse-=2; score.jutaku-=1;
  } else if(state.dementia === "認知症（軽度）"){
    score.groupHome+=3; score.kaigotsuki+=1;
  }

  // --- 予算 ---
  switch(state.budget){
    case "月額15万円以下":
      score.tokuyo+=3; score.carehouse+=3; score.sakou+=2; score.roken+=1;
      score.kaigotsuki-=3; score.jutaku-=1; break;
    case "月額15〜25万円":
      score.jutaku+=2; score.groupHome+=2; score.sakou+=1; score.kaigotsuki+=1; break;
    case "月額25万円以上":
      score.kaigotsuki+=4; score.jutaku+=2; score.groupHome+=1; break;
  }

  // 並べ替え（同点は定義順）
  const order = Object.keys(CARE_TYPES);
  let ranked = order.map(k=>({key:k, s:score[k]})).sort((a,b)=> b.s - a.s || order.indexOf(a.key)-order.indexOf(b.key));

  // --- 重要ルール：認知症あり（軽度/中度以上）ならグループホームを必ずトップ3上位に ---
  const hasDementia = state.dementia === "認知症（軽度）" || state.dementia === "認知症（中度以上）";
  if(hasDementia){
    ranked = ranked.filter(r=>r.key!=="groupHome");
    // 中度以上は1位、軽度は2位以内に配置
    const pos = (state.dementia === "認知症（中度以上）") ? 0 : Math.min(1, ranked.length);
    ranked.splice(pos, 0, {key:"groupHome", s:score.groupHome});
  }

  return ranked.slice(0,3).map(r=>r.key);
}

// 種別ごとの「あなた向けのおすすめ理由」を回答に応じて生成
function reasonFor(key){
  const careTxt = state.care;
  const budTxt = state.budget.replace("月額","");
  const dem = state.dementia;
  switch(key){
    case "groupHome":
      return (dem==="認知症（中度以上）"
        ? "認知症が中度以上とのことなので、専門ケアと少人数の落ち着いた環境を最優先しました。"
        : "もの忘れの不安があるため、早めに認知症ケアの専門環境を選択肢に入れました。")
        + `${state.area}内で通いやすい施設をご用意できます。`;
    case "tokuyo":
      return `${careTxt}で費用を${budTxt}に抑えたいご希望に、公的で負担の軽い特養がよく合います。`;
    case "kaigotsuki":
      return `${careTxt}でも住み替えなく手厚い介護を受けられる点が、ご家族の安心につながります。`;
    case "jutaku":
      return `${careTxt}のうちは自由度を保ちつつ、必要な介護だけ足せる柔軟さが向いています。`;
    case "sakou":
      return `${careTxt}で自宅に近い暮らしを保ちたい方に、見守り付きの住まいとして最適です。`;
    case "roken":
      return `退院後やリハビリのご希望があれば、医療・リハビリに強い老健が候補になります。`;
    case "carehouse":
      return `${careTxt}で費用を${budTxt}に抑えたいご希望に、低費用のケアハウスが合います。`;
  }
  return "";
}

  updateProgress(6, "ステップ6 / 7　合う種別");

    <div class="cta-icon">🤝</div>
    <div class="cta-title">気になる施設を相談員に無料相談</div>
    <div class="cta-desc">これまでのご回答を引き継いで、ぴったりの施設えらびをお手伝いします。しつこい勧誘はありません。</div>
    <button class="cta-btn" id="ctaBtn">無料で相談員に相談する</button>
    <div class="cta-note">通話・相談はすべて無料です</div>`;
  chat.appendChild(box);
  box.querySelector('#ctaBtn').onclick = openModal;
  scrollDown();

  // リスタート
  const r = document.createElement('div');
  r.className = 'restart';
  r.innerHTML = `<button id="restartBtn">↺ 最初からやり直す</button>`;
  chat.appendChild(r);
  r.querySelector('#restartBtn').onclick = ()=>{
    chat.innerHTML = '';
    Object.assign(state,{area:null,care:null,dementia:null,budget:null,free:"",chosenType:null});
    start();
  };
  scrollDown();
}

/* ============================================================
   ダミーモーダル
   ============================================================ */
const modalBg = document.getElementById('modalBg');
function openModal(){ modalBg.classList.add('show'); }
function closeModal(){ modalBg.classList.remove('show'); }
modalBg.addEventListener('click', e=>{ if(e.target===modalBg) closeModal(); });

/* 起動 */
start();
</script>
</body>
</html>
